
{% extends "base.html" %}

{% block title %}AI Assistant | CarbonX{% endblock %}

{% block content %}
<div class="chatbot-container">
    <h2>CarbonX AI Assistant</h2>
    <p>Ask questions about emissions, benchmarking, carbon credits, and CarbonX features.</p>

    <div id="chat-messages" class="chat-messages" aria-live="polite">
        <div class="chat-message assistant-message">
            Hello! I'm the CarbonX AI Assistant. How can I help you?
        </div>
    </div>

    <form id="chat-form">
        <label for="chat-question">Your question</label>
        <textarea
            id="chat-question"
            name="question"
            rows="3"
            maxlength="1000"
            placeholder="How does CarbonX calculate emissions?"
            required
        ></textarea>

        <button id="send-button" type="submit">Send</button>
        <p id="chat-status" role="status"></p>
    </form>
</div>

<style>
.chatbot-container {
    max-width: 800px;
    margin: 24px auto;
}

.chat-messages {
    min-height: 250px;
    max-height: 450px;
    overflow-y: auto;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 20px 0;
}

.chat-message {
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.assistant-message {
    background: #f0f4f8;
}

.user-message {
    background: #e1f1e5;
    text-align: right;
}

#chat-question {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin: 8px 0 12px;
    padding: 12px;
    font: inherit;
    resize: vertical;
}

#send-button {
    padding: 10px 24px;
    cursor: pointer;
}

#chat-status {
    min-height: 1.5em;
}
</style>

<script>
const chatForm = document.getElementById("chat-form");
const questionInput = document.getElementById("chat-question");
const messages = document.getElementById("chat-messages");
const statusText = document.getElementById("chat-status");
const sendButton = document.getElementById("send-button");

function addMessage(text, className) {
    const message = document.createElement("div");
    message.className = "chat-message " + className;
    message.textContent = text;
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
}

chatForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const question = questionInput.value.trim();

    if (!question) {
        statusText.textContent = "Please enter a question.";
        return;
    }

    if (question.length > 1000) {
        statusText.textContent = "Your question must be 1000 characters or fewer.";
        return;
    }

    addMessage(question, "user-message");
    questionInput.value = "";
    sendButton.disabled = true;
    statusText.textContent = "Thinking...";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "The request failed.");
        }

        addMessage(data.answer, "assistant-message");
        statusText.textContent = "";
    } catch (error) {
        statusText.textContent = error.message ||
            "Unable to contact the AI assistant. Please try again.";
    } finally {
        sendButton.disabled = false;
        questionInput.focus();
    }
});
</script>
{% endblock %}
